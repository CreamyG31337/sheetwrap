[project]
name = "sheetwrap"
version = "0.1.0"
description = "Wrap existing PDF report pages in a title block sheet without touching the embedded images."
readme = "README.md"
requires-python = ">=3.10"
# PyMuPDF 2.x pulls in onnxruntime/numpy/networkx for layout analysis we don't use
dependencies = ["pymupdf>=1.24.3,<2"]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]  # sheetwrap.xlsx.write_xlsx
dev = ["pytest", "openpyxl>=3.1"]

[project.scripts]
sheetwrap = "sheetwrap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheetwrap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
